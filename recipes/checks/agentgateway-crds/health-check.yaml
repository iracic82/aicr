# agentgateway-crds Health Check
#
# CRD-only component. Validates that every CRD this component installs
# has reached the `Established=True` condition (CRD storage is up and
# the apiserver will accept CRs of those kinds).
#
# Scope: the chart's agentgateway.dev/v1alpha1 CRDs. The Gateway API and
# Inference Extension CRDs belong to the gateway-api-crds component and are
# asserted by its own check.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: agentgateway-crds-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-agentgateway-crds-established
      # agentgateway.dev/v1alpha1 CRDs installed by the agentgateway-crds
      # Helm chart. AgentgatewayModel is asserted despite the app chart's
      # `agentgatewayModels.enabled: false` default: that value gates the
      # controller's support for the kind, not installation of the CRD.
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: agentgatewaybackends.agentgateway.dev
              status:
                (conditions[?type == 'Established']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: agentgatewaymodels.agentgateway.dev
              status:
                (conditions[?type == 'Established']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: agentgatewayparameters.agentgateway.dev
              status:
                (conditions[?type == 'Established']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: agentgatewaypolicies.agentgateway.dev
              status:
                (conditions[?type == 'Established']):
                  - status: "True"
